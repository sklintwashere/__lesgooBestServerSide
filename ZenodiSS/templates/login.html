{% extends "base.html" %}
{% block title %}Login - Zenocide{% endblock %}

{% block head %}
<style>
    .login-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 85vh;
        padding: 20px;
    }
    
    .login-card {
        background: #0a0a0c;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 48px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
        position: relative;
        overflow: hidden;
    }

    /* Top glowing accent line */
    .login-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .login-header {
        text-align: center;
        margin-bottom: 36px;
    }

    .login-header h2 {
        margin: 0 0 8px 0;
        color: white;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
    }

    .login-header p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
    }

    .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 20px;
    }

    .input-group label {
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .input-group input {
        background: #000;
        border: 1px solid var(--border);
        padding: 16px;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-family: var(--font-mono);
        outline: none;
        transition: all 0.2s;
    }

    .input-group input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
    }

    .input-group input::placeholder {
        color: #333;
        font-weight: 400;
    }

    .error-msg {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid var(--danger);
        color: var(--danger);
        padding: 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 24px;
        animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
    }

    .login-btn {
        width: 100%;
        background: var(--accent);
        color: black;
        border: none;
        padding: 16px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 800;
        font-family: var(--font-mono);
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 10px;
    }

    .login-btn:hover {
        background: var(--accent-2);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        transform: translateY(-1px);
    }
    
    .login-btn:active {
        transform: translateY(1px);
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>Zenocide Access</h2>
            <p>Enter your credentials to continue</p>
        </div>

        {% if error %}
        <div class="error-msg">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required autocomplete="off">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            
            <button type="submit" class="login-btn">AUTHENTICATE</button>
        </form>
    </div>
</div>
{% endblock %}
