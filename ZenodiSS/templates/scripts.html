{% extends "base.html" %}
{% block title %}Payloads - Zinject{% endblock %}

{% block head %}
<style>
    .search-container { margin-bottom: 24px; position: relative; }
    .search-container input {
        width: 100%; background: #0a0a0c; border: 1px solid var(--border);
        color: var(--accent-2); padding: 14px 20px; border-radius: 6px;
        font-size: 14px; outline: none; font-family: var(--font-mono);
    }
    .search-container input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }

    .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px; }
    .chip {
        background: #0a0a0c; border: 1px solid var(--border); color: var(--muted);
        padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: 600;
        cursor: pointer; transition: all 0.2s; font-family: var(--font-mono);
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { background: rgba(16, 185, 129, 0.1); color: var(--accent); border-color: var(--accent); }

    .scripts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .script-card { background: #0a0a0c; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; transition: all 0.2s; }
    .script-card:hover { border-color: var(--accent); box-shadow: 0 0 15px rgba(16, 185, 129, 0.15); }

    .script-image { height: 160px; width: 100%; position: relative; background: #000; border-bottom: 1px solid var(--border); }
    .script-image img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }

    .script-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
    .script-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .script-title { font-size: 16px; font-weight: 700; color: white; margin: 0; }
    .badge { background: #000; border: 1px solid var(--accent); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .script-desc { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 20px 0; flex: 1; }

    .script-actions { display: flex; gap: 10px; }
    .btn-execute {
        flex: 1; background: transparent; border: 1px solid var(--accent); color: var(--accent);
        border-radius: 6px; padding: 10px; font-size: 13px; font-weight: 700;
        cursor: pointer; display: flex; justify-content: center; align-items: center;
        gap: 8px; transition: all 0.2s; font-family: var(--font-mono);
    }
    .btn-execute:hover { background: var(--accent); color: black; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }

    .btn-copy {
        background: transparent; border: 1px solid var(--border); color: var(--muted);
        border-radius: 6px; width: 42px; display: flex; justify-content: center;
        align-items: center; cursor: pointer; transition: all 0.2s;
    }
    .btn-copy:hover { border-color: white; color: white; }
</style>
{% endblock %}

{% block content %}
<section class="heading">
    <div>
        <div class="eyebrow">Local Payloads</div>
        <h1>Script <span>Database</span></h1>
        <p class="sub">Select payload to inject into console.</p>
    </div>
</section>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="&gt; grep 'script_name' ...">
</div>

<div class="chips" id="filterChips">
    <button class="chip active" data-cat="All">[ ALL ]</button>
    <button class="chip" data-cat="Tool">Hubs</button>
    <button class="chip" data-cat="ServerSide">ServerSide</button>
    <button class="chip" data-cat="Admin">Admin</button>
</div>

<div class="scripts-grid" id="scriptGrid"></div>

<script>
    const scriptsData = [
        {
            name: "Internal Zinject ServerSide",
            category: "ServerSide",
            description: "Best ServerSide on planet mars",
            image: "{{ url_for('static', filename='ZinjectLOader.png') }}",
            code: 'require(82699414156552):ZinjectSS("player name")'
        },
        {
            name: "dark mango",
            category: "Tool",
            description: "dark mangoo",
            image: "{{ url_for('static', filename='dark mango.png') }}",
            code: 'require(61387635000000+61387635000000+569362)("Username")'
        },
        {
            name: "gun pack",
            category: "Tool",
            description: "gun pack",
            image: "{{ url_for('static', filename='ZinjectLOader.png') }}",
            code: 'require(2823974237).giveGuns"username"'
        },
        {
            name: "destroy tool",
            category: "Tool",
            description: "A tool that destroys ANYTHING but the owner",
            image: "{{ url_for('static', filename='destroy tool.png') }}",
            code: 'require(135610562888611).Gear("user")'
        }

    ];

    const grid = document.getElementById('scriptGrid');
    const searchInput = document.getElementById('searchInput');
    const chips = document.querySelectorAll('.chip');
    let currentCategory = 'All';

    function renderScripts() {
        const query = searchInput.value.toLowerCase();
        const filtered = scriptsData.filter(s => {
            const matchesSearch = s.name.toLowerCase().includes(query) || s.description.toLowerCase().includes(query);
            const matchesCategory = currentCategory === 'All' || s.category === currentCategory;
            return matchesSearch && matchesCategory;
        });

        grid.innerHTML = '';
        if (filtered.length === 0) {
            grid.innerHTML = '<p style="color: var(--muted);">&gt; No payloads found.</p>';
            return;
        }

        filtered.forEach(script => {
            const safeCode = script.code.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const imgUrl = script.image || 'https://tr.rbxcdn.com/180DAY-cf32e5bb3b2e7a1d2b8f1c5e2a4d1f1b/420/420/Image/Png/noFilter';

            const card = document.createElement('article');
            card.className = 'script-card';
            card.innerHTML = `
                <div class="script-image">
                    <img src="${imgUrl}" alt="${script.name}" loading="lazy">
                </div>
                <div class="script-body">
                    <div class="script-header">
                        <h2 class="script-title">${script.name}</h2>
                        <span class="badge">${script.category}</span>
                    </div>
                    <p class="script-desc">${script.description}</p>
                    <div class="script-actions">
                        <button class="btn-execute" onclick="executeScript('${safeCode}', '${script.name}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> RUN
                        </button>
                        <button class="btn-copy" onclick="copyScript('${safeCode}', this)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function executeScript(code, name) {
        localStorage.setItem('zinject_payload', code);
        window.location.href = '/executor';
    }

    function copyScript(code, btn) {
        const textArea = document.createElement("textarea");
        textArea.value = code.replace(/&quot;/g, '"');
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);

        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        setTimeout(() => btn.innerHTML = originalHTML, 1500);
    }

    searchInput.addEventListener('input', renderScripts);

    chips.forEach(chip => {
        chip.addEventListener('click', () => {
            chips.forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentCategory = chip.getAttribute('data-cat');
            renderScripts();
        });
    });

    renderScripts();
</script>
{% endblock %}
