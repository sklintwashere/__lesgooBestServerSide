<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Zinject | ServerSide{% endblock %}</title>
    <!-- Monospace Hacker Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --panel: #0a0a0c;
            --panel-2: #111114;
            --border: #1f2937;
            --text: #e5e7eb;
            --muted: #6b7280;
            --accent: #10b981;      /* Matrix Green */
            --accent-2: #34d399;
            --danger: #ef4444;
            --font-mono: 'Fira Code', monospace;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            background: #000;
            /* Subtle matrix grid background */
            background-image:
                linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text); font-family: var(--font-mono);
        }
        .navbar {
            height: 60px; padding: 0 28px; display: flex; align-items: center; gap: 28px;
            border-bottom: 1px solid var(--accent); background: rgba(5,5,5,.9);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }
        .brand { color: var(--accent); text-decoration: none; font-size: 18px; font-weight: 800; letter-spacing: 1px; }
        .brand span { color: white; }
        .nav-links { display: flex; gap: 15px; flex: 1; }
        .nav-links a {
            color: var(--muted); text-decoration: none; padding: 8px 12px;
            border-radius: 4px; font-size: 13px; font-weight: 600;
            border: 1px solid transparent; transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--accent); border: 1px solid var(--accent); background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }
        .account { color: var(--accent-2); font-size: 13px; font-weight: 600; }
        .logout {
            border: 1px solid var(--danger); background: transparent; color: var(--danger);
            border-radius: 4px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-family: var(--font-mono);
            transition: all 0.2s;
        }
        .logout:hover { background: var(--danger); color: white; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
        .wrap { width: min(1280px, calc(100% - 40px)); margin: 0 auto; padding: 42px 0 70px; }
        .heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
        .eyebrow { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
        h1 { margin: 0; font-size: 32px; font-weight: 700; color: white; }
        h1 span { color: var(--accent); }
        .sub { margin: 8px 0 0; color: var(--muted); font-size: 13px; }

        /* Global Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="/games">ZINJECT <span>ServerSide</span></a>
        <div class="nav-links">
            <a href="/games" class="{% if active_page == 'games' %}active{% endif %}">./Games</a>
            <a href="/scripts" class="{% if active_page == 'scripts' %}active{% endif %}">./Scripts</a>
            <a href="/executor" class="{% if active_page == 'executor' %}active{% endif %}">./Console</a>
        </div>
        <span class="account">[ {{ username }} ]</span>
        <form method="POST" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="logout" type="submit">Logout</button>
        </form>
    </nav>
    <main class="wrap">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
